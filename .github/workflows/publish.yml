name: Publish to PyPI

# Releases are tags. A conventional commit merged to main creates the next tag;
# a manually pushed tag remains supported for recovery and exceptional releases.

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0
  # The same release, re-run by hand. A tag push is the normal path, and it is
  # not always enough on its own: a tag pushed while Actions is down never
  # queues a run, and re-pushing the tag to provoke one is a poor tool for a
  # release. Naming the tag here runs the same jobs against the same commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # PyPI Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      # `inputs.tag` on a manual run, the pushed tag otherwise. Checking the tag
      # out explicitly matters on the manual path: the workflow file comes from
      # whichever branch was selected, and what gets built has to come from the
      # tag rather than from that branch's head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      # hatch-vcs derives package metadata from the checked-out tag. Check the
      # built artifact rather than keeping a second version in pyproject.toml.
      - name: The tag must match the built package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import email, os, pathlib, sys, zipfile

          tag = os.environ["TAG"].removeprefix("v")
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_path = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_path))
          built = metadata["Version"]
          if tag != built:
              sys.exit(f"tag {tag} does not match built package version {built}")
          print(f"releasing {built}")
          PY

      # Trusted Publishing, so there is no API token to store or rotate. PyPI
      # is configured to trust this repository, this workflow file, and the
      # `pypi` environment above; changing any of those three breaks the
      # release until PyPI's publisher settings are updated to match.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # A tag is a git object with no page. A release is where someone deciding
  # whether to install this reads what changed and whether it is still alive,
  # and PyPI shows them the current version and nothing about the last one.
  #
  # Its own job so that `publish` keeps `contents: read`: the job holding the
  # PyPI identity token has no business also being able to write to the repo.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Notes are generated from what changed since the previous tag, which
          # a shallow clone cannot see.
          fetch-depth: 0

      # --generate-notes writes them from the pull requests merged since that
      # tag, so there is no changelog to maintain by hand and no second place
      # for the history to be wrong.
      #
      # The sdist and wheel are deliberately not attached: PyPI already serves
      # them, and a second copy is one more thing that can disagree.
      # `--verify-tag` so a typo in the manual input fails here rather than
      # creating a release for a tag that does not exist.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --generate-notes --verify-tag
