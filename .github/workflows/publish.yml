name: Publish to PyPI

# Releases are tags. A conventional commit merged to main creates the next tag;
# a manually pushed tag remains supported for recovery and exceptional releases.

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0
  # The same release, re-run by hand. A tag push is the normal path, and it is
  # not always enough on its own: a tag pushed while Actions is down never
  # queues a run, and re-pushing the tag to provoke one is a poor tool for a
  # release. Naming the tag here runs the same jobs against the same commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # PyPI Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      # `inputs.tag` on a manual run, the pushed tag otherwise. Checking the tag
      # out explicitly matters on the manual path: the workflow file comes from
      # whichever branch was selected, and what gets built has to come from the
      # tag rather than from that branch's head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      # hatch-vcs derives package metadata from the checked-out tag. Check the
      # built artifact rather than keeping a second version in pyproject.toml.
      - name: The tag must match the built package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import email, os, pathlib, sys, zipfile

          tag = os.environ["TAG"].removeprefix("v")
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_path = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_path))
          built = metadata["Version"]
          if tag != built:
              sys.exit(f"tag {tag} does not match built package version {built}")
          print(f"releasing {built}")
          PY

      # Trusted Publishing, so there is no API token to store or rotate. PyPI
      # is configured to trust this repository, this workflow file, and the
      # `pypi` environment above; changing any of those three breaks the
      # release until PyPI's publisher settings are updated to match.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # A tag is a git object with no page. A release is where someone deciding
  # whether to install this reads what changed and whether it is still alive,
  # and PyPI shows them the current version and nothing about the last one.
  #
  # Its own job so that `publish` keeps `contents: read`: the job holding the
  # PyPI identity token has no business also being able to write to the repo.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Notes are generated from what changed since the previous tag, which
          # a shallow clone cannot see.
          fetch-depth: 0

      - name: Resolve release range
        id: release-range
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/release-range.sh "$TAG" "$GITHUB_OUTPUT"

      - name: Resolve changelog object key
        id: changelog-object
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assume changelog publisher role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CHANGELOG_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Public commit subjects and bodies from the release range are sent to
      # Anthropic for customer-facing copy. Custom instructions are optional,
      # untrusted editorial guidance; the Action keeps evidence rules dominant.
      - name: Render end-user release notes
        id: changelog
        uses: sparepartslabs/spareparts-changelog@v0
        with:
          provider: anthropic
          instructions: ${{ vars.CHANGELOG_INSTRUCTIONS }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          from: ${{ steps.release-range.outputs.from }}
          to: ${{ steps.release-range.outputs.to }}
          title: ${{ inputs.tag || github.ref_name }}
          write-repository: "false"
          publish-s3: "true"
          s3-bucket: ${{ vars.CHANGELOG_S3_BUCKET }}
          s3-key: releases/spareparts-cli/${{ steps.changelog-object.outputs.version }}.md
          s3-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          publish-linkedin: "false"

      - name: Write canonical release notes
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.markdown }}
        run: |
          test -n "$RELEASE_NOTES"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

      # The changelog Action renders normalized Conventional Commit evidence
      # through Anthropic into the notes file above. Keeping the AI call in this
      # separately permissioned job means the PyPI identity job never receives
      # the provider credential.
      #
      # The sdist and wheel are deliberately not attached: PyPI already serves
      # them, and a second copy is one more thing that can disagree.
      # `--verify-tag` so a typo in the manual input fails here rather than
      # creating a release for a tag that does not exist.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --notes-file release-notes.md --verify-tag
