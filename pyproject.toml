[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spareparts-cli"
version = "0.2.0"
description = "sp — the Spare Parts command line"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Spare Parts Labs" }]

# Deliberately thin. Everything the terminal rendering needs is in the stdlib;
# a CLI people install to try one subcommand should not drag in a UI toolkit.
#
# No vendor SDK is a base dependency. Shipping one made it the assumed answer,
# and someone who runs on another vendor paid to install a client they never
# call. Install the one you use, or `[all]` to try more than one. A vendor
# without its SDK says so and names the extra that fixes it.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.72"]
openai = ["openai>=2.0"]
gemini = ["google-genai>=2.0"]
all = ["anthropic>=0.72", "openai>=2.0", "google-genai>=2.0"]
dev = ["pytest>=8.0", "anthropic>=0.72", "openai>=2.0", "google-genai>=2.0"]

[project.scripts]
sp = "spareparts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spareparts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
